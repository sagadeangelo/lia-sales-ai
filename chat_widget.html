<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LIA Sales AI - Analytics & Observability</title>
    
    <style>
        /* ==========================
           UI PREMIUM (Mantenido)
           ========================== */
        #lia-chat-container * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        #lia-chat-container { position: fixed; bottom: 20px; right: 20px; z-index: 999999; display: flex; flex-direction: column; align-items: flex-end; }
        #lia-chat-toggle { width: 60px; height: 60px; background: #00a884; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 4px 16px rgba(0,0,0,0.3); transition: 0.3s; }
        #lia-chat-toggle:hover { transform: scale(1.1); background: #00ca9d; }
        #lia-chat-toggle svg { fill: white; width: 28px; height: 28px; }

        #lia-chat-window {
            display: none; flex-direction: column; width: 380px; height: 600px; max-height: calc(100vh - 100px);
            background: #0b141a; border-radius: 16px; box-shadow: 0 12px 48px rgba(0,0,0,0.5); overflow: hidden;
            border: 1px solid #2a3942; transition: 0.3s; transform: translateY(20px) scale(0.95); opacity: 0;
        }
        #lia-chat-window.active { display: flex; transform: translateY(0) scale(1); opacity: 1; }

        #lia-chat-header { background: #202c33; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a3942; }
        .lia-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #00a884, #00ca9d); border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; }
        .lia-title { font-size: 15px; font-weight: 600; margin: 0; color: #e9edef; }
        .lia-status { font-size: 12px; color: #00a884; margin: 2px 0 0 0; display: flex; align-items: center; gap: 4px; }
        .lia-status::before { content: ''; width: 6px; height: 6px; background: #00a884; border-radius: 50%; }

        #lia-chat-body { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background: #0b141a; scroll-behavior: smooth; }
        .lia-msg { max-width: 85%; padding: 10px 16px; border-radius: 12px; font-size: 14.5px; line-height: 1.5; color: #e9edef; animation: msgFadeIn 0.3s ease-out forwards; }
        @keyframes msgFadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .lia-msg-bot { align-self: flex-start; background: #202c33; border-top-left-radius: 2px; }
        .lia-msg-user { align-self: flex-end; background: #005c4b; border-top-right-radius: 2px; }

        #lia-chat-footer { background: #202c33; padding: 12px 16px; display: flex; gap: 12px; border-top: 1px solid #2a3942; }
        #lia-chat-input { flex: 1; background: #2a3942; border: none; padding: 12px 16px; border-radius: 24px; color: #e9edef; outline: none; }
        #lia-chat-send { background: #00a884; border: none; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }

        .lia-typing { display: flex; gap: 4px; padding: 4px 0; }
        .lia-dot { width: 6px; height: 6px; background: #8696a0; border-radius: 50%; animation: liaBounce 1.4s infinite ease-in-out both; }
        .lia-dot:nth-child(1) { animation-delay: -0.32s; }
        .lia-dot:nth-child(2) { animation-delay: -0.16s; }
        @keyframes liaBounce { 0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }

        @media (max-width: 480px) {
            #lia-chat-window { width: 100vw; height: 100vh; max-height: 100vh; border-radius: 0; bottom: 0; right: 0; }
        }
    </style>
</head>
<body>

    <div id="lia-chat-container">
        <div id="lia-chat-toggle" onclick="LIA_ACTIONS.toggleChat()">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
        </div>
        <div id="lia-chat-window">
            <div id="lia-chat-header">
                <div class="lia-avatar">L</div>
                <div><p class="lia-title">LIA Asesor</p><p class="lia-status">En línea</p></div>
                <button onclick="LIA_ACTIONS.toggleChat()" style="background:none;border:none;color:#aaa;font-size:20px;cursor:pointer;">×</button>
            </div>
            <div id="lia-chat-body"></div>
            <div id="lia-chat-footer">
                <input type="text" id="lia-chat-input" placeholder="Escribe aquí..." autocomplete="off">
                <button id="lia-chat-send" onclick="LIA_ACTIONS.handleSend()">
                    <svg viewBox="0 0 24 24" style="fill:white;width:20px;"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * LIA ANALYTICS & OBSERVABILITY (INVISIBLE)
         */
        const LIA_ANALYTICS = {
            events: [],
            startTime: Date.now(),

            track: (name, data = {}) => {
                const event = {
                    name,
                    timestamp: new Date().toISOString(),
                    context: LIA_STATE.context,
                    ...data
                };
                LIA_ANALYTICS.events.push(event);
                
                // Debug Log (Solo en desarrollo/consola)
                if (LIA_CONFIG.DEBUG) {
                    console.group(`[LIA Analytics]: ${name}`);
                    console.table(data);
                    console.groupEnd();
                }

                // Aquí podrías enviar a un endpoint:
                // fetch(LIA_CONFIG.ANALYTICS_URL, { method: 'POST', body: JSON.stringify(event) });
            },

            getDropoffProfile: () => {
                const lastEvent = LIA_ANALYTICS.events[LIA_ANALYTICS.events.length - 1];
                return {
                    totalTime: (Date.now() - LIA_ANALYTICS.startTime) / 1000,
                    messageCount: LIA_STATE.metrics.msgCount,
                    lastAction: lastEvent ? lastEvent.name : 'none'
                };
            }
        };

        const LIA_PSYCHOLOGY = {
            lastFillerType: null,
            detectEmotion: (text) => {
                const lower = text.toLowerCase().trim();
                const profile = { urgency: 0, intent: 0, objection: false, abandonment: false };

                if (/\b(caro|dinero|lana|presupuesto|despues|pensar|barato)\b/.test(lower)) {
                    profile.objection = true;
                    LIA_ANALYTICS.track('objection_detected', { type: 'price_or_time', text: lower });
                }

                if (lower.length < 4 || /\b(ok|ya|si|no|vale)\b/.test(lower)) {
                    profile.abandonment = true;
                    LIA_ANALYTICS.track('low_engagement', { text: lower });
                }

                if (/\b(comprar|pagar|quiero|info|pago)\b/.test(lower)) {
                    profile.intent = 1;
                    LIA_ANALYTICS.track('intent_high', { text: lower });
                }

                return profile;
            }
        };

        const LIA_CONFIG = {
            API_URL: "https://agents.lasagadeangelo.com.mx/chat",
            CHUNK_PAUSE: 1200,
            DEBUG: true // Activar para ver logs en consola
        };

        const LIA_STORAGE = {
            get: (k) => JSON.parse(localStorage.getItem(`lia_${k}`)),
            set: (k, v) => localStorage.setItem(`lia_${k}`, JSON.stringify(v))
        };

        const LIA_STATE = {
            sessionId: LIA_STORAGE.get('session_id') || ("user_" + Date.now()),
            isOpen: false,
            context: sessionStorage.getItem('lia_context') || 'general',
            metrics: { msgCount: 0, conversionScore: 0 }
        };
        LIA_STORAGE.set('session_id', LIA_STATE.sessionId);

        const LIA_ACTIONS = {
            toggleChat: () => {
                const win = document.getElementById('lia-chat-window');
                LIA_STATE.isOpen = !LIA_STATE.isOpen;
                LIA_ANALYTICS.track(LIA_STATE.isOpen ? 'chat_opened' : 'chat_closed', LIA_ANALYTICS.getDropoffProfile());

                if (LIA_STATE.isOpen) {
                    win.classList.add('active');
                    LIA_ACTIONS.checkReconnection();
                    setTimeout(() => document.getElementById('lia-chat-input').focus(), 300);
                } else win.classList.remove('active');
            },

            checkReconnection: () => {
                const body = document.getElementById('lia-chat-body');
                if (body.children.length > 0) return;
                LIA_ANALYTICS.track('conversation_start', { first_time: !LIA_STORAGE.get('memory') });
                LIA_UI.renderMessage("¡Hola! Soy LIA, tu asesor personal. ¿En qué puedo apoyarte hoy? 👀", 'bot');
            },

            handleSend: () => {
                const input = document.getElementById('lia-chat-input');
                const val = input.value.trim();
                if (val && !LIA_STATE.isSending) {
                    input.value = '';
                    LIA_STATE.metrics.msgCount++;
                    LIA_ANALYTICS.track('message_sent', { text: val, msgIndex: LIA_STATE.metrics.msgCount });
                    LIA_ACTIONS.sendMessage(val);
                }
            },

            sendMessage: async (message) => {
                LIA_STATE.isSending = true;
                LIA_UI.renderMessage(message, 'user');
                
                const emotion = LIA_PSYCHOLOGY.detectEmotion(message);
                LIA_UI.showTyping();

                try {
                    const res = await fetch(LIA_CONFIG.API_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            session_id: LIA_STATE.sessionId,
                            message: message,
                            contexto: LIA_STATE.context
                        })
                    });
                    const data = await res.json();
                    LIA_UI.hideTyping();
                    
                    LIA_ANALYTICS.track('agent_response', { agent: data.agente, etapa: data.etapa });
                    
                    await LIA_ACTIONS.processBotResponse(data.response);
                } catch (e) {
                    LIA_UI.hideTyping();
                    LIA_ANALYTICS.track('system_error', { error: e.message });
                    LIA_UI.renderMessage("Híjole, se me cortó la señal. 😅 ¿Me repites?", 'bot');
                } finally {
                    LIA_STATE.isSending = false;
                }
            },

            processBotResponse: async (text) => {
                const chunks = text.split(/\n\n|\. |\? /).filter(c => c.trim().length > 0);
                for (let i = 0; i < chunks.length; i++) {
                    LIA_UI.showTyping();
                    await new Promise(r => setTimeout(r, 1000)); // Delay base
                    LIA_UI.hideTyping();
                    LIA_UI.renderMessage(chunks[i], 'bot');
                    if (i < chunks.length - 1) await new Promise(r => setTimeout(r, LIA_CONFIG.CHUNK_PAUSE));
                }
            }
        };

        const LIA_UI = {
            renderMessage: (text, type) => {
                const body = document.getElementById('lia-chat-body');
                const div = document.createElement('div');
                div.className = `lia-msg lia-msg-${type}`;
                div.innerHTML = text.replace(/\n/g, '<br>');
                body.appendChild(div);
                body.scrollTop = body.scrollHeight;
            },
            showTyping: () => {
                const body = document.getElementById('lia-chat-body');
                const div = document.createElement('div');
                div.id = 'lia-typing';
                div.className = 'lia-msg lia-msg-bot';
                div.innerHTML = `<div class="lia-typing"><div class="lia-dot"></div><div class="lia-dot"></div><div class="lia-dot"></div></div>`;
                body.appendChild(div);
                body.scrollTop = body.scrollHeight;
            },
            hideTyping: () => { const el = document.getElementById('lia-typing'); if (el) el.remove(); }
        };

        document.getElementById('lia-chat-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') LIA_ACTIONS.handleSend(); });
        window.addEventListener('load', () => {
            if (!sessionStorage.getItem('lia_auto_opened')) {
                setTimeout(() => { if (!LIA_STATE.isOpen) LIA_ACTIONS.toggleChat(); sessionStorage.setItem('lia_auto_opened', 'true'); }, 3000);
            }
        });
    </script>
</body>
</html>
